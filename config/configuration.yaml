# Minimal config for developing the Doorcy integration.
default_config:

# Dev-only: history is useless here and SQLite over a macOS bind mount is
# the slowest thing in this container. Drop this block for a real install.
recorder:
  purge_keep_days: 1
  exclude:
    domains:
      - automation
      - sensor
      - switch

logger:
  default: warning
  logs:
    custom_components.doorcy: debug
    homeassistant.helpers.update_coordinator: debug
